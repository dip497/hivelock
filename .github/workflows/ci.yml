name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: hook latency
        if: runner.os == 'Linux'
        run: |
          B=target/release/hivelock; export HIVELOCK_HOME="$RUNNER_TEMP/hl"; $B init
          python3 - "$B" <<'PY'
          import json, subprocess, sys, time
          xs = []
          for _ in range(30):
              t = time.perf_counter()
              subprocess.run([sys.argv[1], "hook", "claude", "prompt"], input=json.dumps({"prompt": "refactor the login handler"}), capture_output=True, text=True)
              xs.append((time.perf_counter() - t) * 1000)
          xs.sort(); print(f"p50 {xs[15]:.1f}ms")
          sys.exit(1 if xs[15] >= 10 else 0)
          PY
