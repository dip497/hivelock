[package]
name = "hivelock"
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
description = "Keep secrets out of AI coding agents: agents see names, never values"
license = "MIT"
repository = "https://github.com/dip497/hivelock"
readme = "README.md"
keywords = ["secrets", "ai", "agents", "claude", "codex"]
categories = ["command-line-utilities"]

[dependencies]
aho-corasick = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
getrandom = "0.2"
regex = "1"
rpassword = "7"
scrypt = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[build-dependencies]
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
